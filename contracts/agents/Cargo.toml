[package]
name = "agents"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agent seats: task agents bound to any NEP-171 NFT, with budgets and limits enforced on chain"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
near-sdk = { version = "=5.30.0" }
[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
