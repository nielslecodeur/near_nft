[package]
name = "agent-market"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Sell an AI agent with the NFT that carries it: the buyer pays in NEAR, gets the NFT and the agent's promised budget, or is refunded"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
near-sdk = { version = "=5.30.0" }
[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
