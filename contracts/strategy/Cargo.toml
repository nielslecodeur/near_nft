[package]
name = "strategy"
version = "0.1.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
near-sdk = { version = "=5.30.0" }
near-contract-standards = "=5.30.0"
[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
