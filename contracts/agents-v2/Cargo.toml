[package]
name = "agents-v2"
version = "2.0.0"
edition = "2024"
license = "MIT"
description = "Agent seats v2: agents on any NEP-171 NFT with on-chain limits, a profile and track record that follow the NFT, refusal-flood resistant log, optional budget for the next owner"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
near-sdk = { version = "=5.30.0" }
[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
